name: Deploy showcase to GitHub Pages
on:
  push:
    branches: [master]
    paths: ['site/**', 'firmware/manta-lcd4214-original.bin', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Firmware for the in-browser emulator (site/live)
        run: cp firmware/manta-lcd4214-original.bin site/live/firmware.bin
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
